<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#080b10"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Constellation Mesh Lines -->
  <g stroke="#ff5722" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="120" y1="140" x2="340" y2="280"/>
    <line x1="340" y1="280" x2="220" y2="480"/>
    <line x1="880" y1="120" x2="1050" y2="310"/>
    <line x1="1050" y1="310" x2="920" y2="520"/>
  </g>
  <circle cx="120" cy="140" r="4" fill="#ff5722" fill-opacity="0.4"/>
  <circle cx="340" cy="280" r="5" fill="#ff5722" fill-opacity="0.6"/>
  <circle cx="220" cy="480" r="4" fill="#ff5722" fill-opacity="0.3"/>
  <circle cx="880" cy="120" r="4" fill="#ff5722" fill-opacity="0.5"/>
  <circle cx="1050" cy="310" r="6" fill="#ff5722" fill-opacity="0.7"/>
  <circle cx="920" cy="520" r="4" fill="#ff5722" fill-opacity="0.4"/>

  <!-- Brand Mark -->
  <g transform="translate(480, 100)">
    <rect width="64" height="64" rx="20" fill="#ff5722"/>
    <text x="32" y="46" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">b</text>
    <text x="84" y="44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.5">bunkim</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="210" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    PRECISION ATTENDANCE CUSHION &amp; CUT CALCULATOR
  </text>

  <!-- Main Hero Card Preview -->
  <g transform="translate(360, 250)" filter="url(#cardShadow)">
    <rect width="480" height="260" rx="28" fill="#062417" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- Badge -->
    <rect x="32" y="28" width="120" height="30" rx="15" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="92" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">SAFE ZONE</text>

    <!-- Percentage Req -->
    <rect x="330" y="28" width="118" height="30" rx="10" fill="#080b10" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="389" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#cbd5e1" text-anchor="middle">87.5% / 75% req</text>

    <!-- Question Subhead -->
    <text x="32" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#cbd5e1">You can safely bunk</text>

    <!-- Big Number -->
    <text x="32" y="165" font-family="'JetBrains Mono', monospace" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2">6</text>
    <text x="90" y="156" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="900" fill="#ffffff">CLASSES</text>

    <!-- Context note -->
    <text x="32" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Your attendance stays at or above 75% after missing 6 consecutive classes.
    </text>

    <!-- Progress bar -->
    <rect x="32" y="225" width="416" height="8" rx="4" fill="#000000" fill-opacity="0.5"/>
    <rect x="32" y="225" width="364" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Footer metadata -->
  <text x="600" y="580" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">
    100% Client-Side &amp; Private &bull; 10 Languages &bull; Subject Roster &bull; What-If Simulator
  </text>
</svg>
